# ===============================
# 🔹 CONFIGURACIÓN GENERAL
# ===============================
spring.application.name=ms-flota
server.port=8081

# ===============================
# 🔹 CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL en Docker)
# ===============================
spring.datasource.url=jdbc:postgresql://db:5432/tp_contenedores
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 🔹 CONFIGURACIÓN JPA / HIBERNATE
# ===============================
# Hibernate solo valida el esquema existente, no lo crea ni modifica
spring.jpa.hibernate.ddl-auto=validate

# Dialecto SQL para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 🔹 LOGGING (para depurar consultas SQL y parámetros)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.orm.jpa=INFO



# Si ms-flota necesita enviar o recibir datos de otros microservicios
ms.rutas.url=http://ms-rutas:8082
ms.solicitudes.url=http://ms-solicitudes:8083
