services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: >
      osrm-routed /data/argentina-latest.osrm
    networks:
      - tp-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
    volumes:
      - keycloak_data:/opt/keycloak/data



  db:
    image: postgres:16
    container_name: postgres-db-contenedores
    restart: always
    environment:
      POSTGRES_DB: tp_contenedores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-flota:
    build:
      context: .
      dockerfile: ms-flota/Dockerfile
    container_name: ms-flota
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tp_contenedores
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8085:8080"
    networks:
      - tp-network

  ms-rutas:
    build:
      context: .
      dockerfile: ms-rutas/Dockerfile
    container_name: ms-rutas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tp_contenedores
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8082:8080"
    networks:
      - tp-network

  ms-solicitudes:
    build:
      context: .
      dockerfile: ms-solicitudes/Dockerfile
    container_name: ms-solicitudes
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tp_contenedores
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8083:8080"
    networks:
      - tp-network

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      ms-flota:
        condition: service_started
      ms-rutas:
        condition: service_started
      ms-solicitudes:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - tp-network

volumes:
  postgres_data:
  keycloak_data:

networks:
  tp-network:
    driver: bridge
